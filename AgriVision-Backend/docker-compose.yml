services:
  # 1. The Database (Postgres + PostGIS + Timescale)
  db:
    # 'pg15-all' explicitly includes PostGIS control files
    image: timescale/timescaledb-ha:pg15-all
    container_name: agrivision_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agrivision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agrivision_net

  # 2. Redis (Caching & Speed)
  redis:
    image: redis:alpine
    container_name: agrivision_redis
    restart: always
    networks:
      - agrivision_net

  # 3. MQTT Broker (The IoT Gateway for your future sensors)
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: agrivision_mqtt
    restart: always
    ports:
      - "1883:1883" # Standard MQTT port
      - "9001:9001" # WebSockets port
    volumes:
      - mosquitto_data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - agrivision_net

  # 4. Modern Management (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:8.14
    platform: linux/amd64   # Required for Apple Silicon (M1/M2/M3) — runs via Rosetta 2
    container_name: agrivision_pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@agrivision.com
      - PGADMIN_DEFAULT_PASSWORD=password
    ports:
      - "5050:80"
    networks:
      - agrivision_net

  # 5. The "Brain" - FastAPI Backend
  backend:
    build: .
    container_name: agrivision_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/agrivision
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - AGROMONITORING_API_KEY=7a9304baa8e2b0e1cf0ec9b79678ad9a
      - GOOGLE_API_KEY=YOUR_GOOGLE_API_KEY_HERE
    volumes:
      - ./app:/app/app
      - ./firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - db
      - redis
      - mqtt
    networks:
      - agrivision_net

networks:
  agrivision_net:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
